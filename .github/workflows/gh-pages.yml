name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: "${{ github.workflow }}-${{ github.ref }}"
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:prod
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: "${{ github.ref == 'refs/heads/main' }}"
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          publish_dir: ./_site
          # The action replaces gh-pages, so a CNAME that exists only on
          # that branch is deleted. Write the live custom domain on every deploy.
          cname: www.launchlead.uk
